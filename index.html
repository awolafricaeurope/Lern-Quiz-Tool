<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lern Quiz PuG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone-width column. Exam countdown ticket on top, subject cards below, tab bar at the bottom; a quiz session takes over the whole screen. */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --fg:#13202f; --muted:#566678; --line:#d9e0e9;
  --pol:#3347c9; --pol-soft:#e7eafb;
  --shk:#a94a18; --shk-soft:#fbece2;
  --good:#1b7a4b; --good-soft:#e0f3e8;
  --bad:#b3261e; --bad-soft:#fbe5e3;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1620; --surface:#172131; --fg:#e8eef6; --muted:#93a2b5; --line:#263246;
    --pol:#9aa7ff; --pol-soft:#1f2750;
    --shk:#f29a63; --shk-soft:#3a2417;
    --good:#5fd08f; --good-soft:#143324;
    --bad:#ff8c84; --bad-soft:#401a17;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1620; --surface:#172131; --fg:#e8eef6; --muted:#93a2b5; --line:#263246;
  --pol:#9aa7ff; --pol-soft:#1f2750;
  --shk:#f29a63; --shk-soft:#3a2417;
  --good:#5fd08f; --good-soft:#143324;
  --bad:#ff8c84; --bad-soft:#401a17;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-block:12px 112px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.de{hyphens:auto;overflow-wrap:break-word;min-width:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--pol);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:52px;height:52px;border-radius:50%;flex:none;display:block}
.mark{font:700 21px/1 var(--f-display);letter-spacing:-.01em}
.status{font:500 12px var(--f-mono);color:var(--muted)}

.ticket{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px}
.cd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.cd .n{font:600 64px/1 var(--f-mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.cd .l{font:600 17px var(--f-display)}
.cd .d{color:var(--muted);font-size:14px;width:100%}
.tally{display:flex;gap:3px;flex-wrap:wrap;align-items:flex-end}
.tally i{width:5px;height:16px;border-radius:1px;background:var(--fg)}
.tally i.past{background:var(--line)}
.tally i.now{background:var(--pol);height:24px}
.pace{font-size:14px;color:var(--muted)}

.daily{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;margin-block:14px;padding:16px 18px;border-radius:14px;background:var(--fg);color:var(--bg);border:0;text-align:left;cursor:pointer}
.daily b{display:block;font:700 18px var(--f-display)}
.daily small{display:block;font:500 13px var(--f-mono);opacity:.8}
.daily:disabled{opacity:.5;cursor:default}
.daily .bar2{height:4px;border-radius:2px;background:currentColor;opacity:.25;margin-top:8px;position:relative}
.daily .bar2 i{position:absolute;inset:0 auto 0 0;background:currentColor;border-radius:2px}

.sh{font:600 12px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px}
.grid{display:grid;gap:12px}
@media (min-width:560px){.grid.two{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.subj h3{font-size:18px}
.subj.pol h3{color:var(--pol)}
.subj.shk h3{color:var(--shk)}
.stats{display:flex;gap:18px;margin:0}
.stats div{min-width:0}
.stats dt{font-size:12px;color:var(--muted)}
.stats dd{margin:0;font:600 20px var(--f-mono)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter b{display:block;height:100%;border-radius:3px}
.pol .meter b{background:var(--pol)}
.shk .meter b{background:var(--shk)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.chip{display:inline-block;padding:2px 8px;border-radius:999px;font:600 12px var(--f-body);white-space:nowrap}
.chip.pol{background:var(--pol-soft);color:var(--pol)}
.chip.shk{background:var(--shk-soft);color:var(--shk)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--fg);background:var(--fg);color:var(--bg);font-weight:600;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--muted);padding:8px 0;cursor:pointer;font-weight:600}

.rowc{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.rowc .t{flex:1;min-width:0;display:grid;gap:2px}
.rowc .t span{font-weight:600}
.rowc .acc{font:600 15px var(--f-mono)}
.empty{color:var(--muted);font-size:15px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;max-width:200px;background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 4px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;border-radius:10px}
.tabs button[aria-current="page"]{color:var(--fg)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px;padding-block:6px 14px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar b{display:block;height:100%;background:var(--fg);border-radius:3px;transition:width .25s}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qmeta .topic{color:var(--muted);font-size:14px}
.q{font-size:22px;font-weight:600;margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:52px;cursor:pointer}
.opt .k{font:600 12px var(--f-mono);width:24px;height:24px;border-radius:6px;background:var(--bg);display:grid;place-items:center;flex:none}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;display:grid;gap:4px}
.fb.good{background:var(--good-soft);color:var(--fg)}
.fb.good strong{color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--fg)}
.fb.bad strong{color:var(--bad)}
.blk{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;gap:4px}
.blk.model{border-color:var(--good)}
.lbl{display:block;font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
textarea,select,.field{width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
textarea{resize:vertical;min-height:96px}
.dock{position:sticky;bottom:0;display:flex;gap:10px;padding-block:14px 8px;background:linear-gradient(to bottom,transparent,var(--bg) 35%)}
.dock .btn{flex:1}
.score{font:600 64px/1 var(--f-mono);letter-spacing:-.04em;margin-block:8px}
.misses{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.misses li{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;gap:4px}
.misses .ans{color:var(--good);font-weight:600}

/* add + library */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-align:center}
.seg button[aria-pressed="true"].pol{border-color:var(--pol);background:var(--pol-soft);color:var(--pol)}
.seg button[aria-pressed="true"].shk{border-color:var(--shk);background:var(--shk-soft);color:var(--shk)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
label.btn:focus-within{outline:2px solid var(--pol);outline-offset:2px}
.files{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.files li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:14px}
.files li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err{padding:10px 12px;border-radius:10px;background:var(--bad-soft);color:var(--fg);font-size:14px}
.note{font-size:13px;color:var(--muted)}
.prev{display:grid;gap:8px}
.prev label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.prev input{margin-top:4px;width:18px;height:18px;flex:none}
.prev .b{display:grid;gap:3px;min-width:0}
.prev .a{color:var(--good);font-size:14px;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grp{margin-top:18px;display:grid;gap:8px}
.grp h3{font-size:15px;display:flex;gap:8px;align-items:center}
.qrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qbtn{width:100%;text-align:left;background:none;border:0;padding:12px 14px;display:grid;gap:2px;cursor:pointer}
.qbtn .meta{font-size:12px;color:var(--muted)}
.qdet{padding:0 14px 14px;display:grid;gap:8px;font-size:15px}
.qdet ul{margin:0;padding-left:18px}
.qdet li.c{color:var(--good);font-weight:600}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:reduce){.bar b{transition:none}}
</style>

<div class="wrap"><div id="app"></div></div>
<nav class="tabs" id="tabs" aria-label="Main">
  <button data-act="tab" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-act="tab" data-tab="add"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 12v6M9 15h6"/></svg>Add notes</button>
  <button data-act="tab" data-tab="lib"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Library</button>
</nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
const EXAM=new Date(2026,11,11);
let GOAL=10;
const KEY='lernquiz-pug-v1';
const CH=120;
const CHUNK=14000;
const SUBJ={
  pug:{name:'Politik und Gesellschaft',short:'Politik',cls:'pol'}
};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mid=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const daysBetween=(a,b)=>Math.round((mid(b)-mid(a))/864e5);
const pl=(n,w)=>n+' '+w+(n===1?'':'s');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* starter questions, marked as examples */
function seed(){
  const out=[];
  const mc=(id,subj,topic,q,options,correct,expl)=>out.push({id,subj,topic,type:'mc',q,options,correct,expl,starter:true});
  const sh=(id,subj,topic,q,a,expl)=>out.push({id,subj,topic,type:'short',q,a,expl,starter:true});
  mc('s-p1','pug','Grundgesetz','Welcher Artikel des Grundgesetzes schützt die Würde des Menschen?',['Artikel 1','Artikel 5','Artikel 20','Artikel 38'],0,'Artikel 1 Absatz 1: Die Würde des Menschen ist unantastbar.');
  mc('s-p2','pug','Staatsaufbau','Wie viele Bundesländer hat die Bundesrepublik Deutschland?',['14','15','16','17'],2,'Es gibt 16 Bundesländer, darunter die drei Stadtstaaten Berlin, Hamburg und Bremen.');
  mc('s-p3','pug','Wahlen','Mit welcher Stimme wird bei der Bundestagswahl eine Partei gewählt?',['Erststimme','Zweitstimme','Direktstimme','Briefstimme'],1,'Mit der Erststimme wird eine Person im Wahlkreis gewählt, mit der Zweitstimme eine Partei.');
  mc('s-p4','pug','Wahlen','Wie lange dauert eine Wahlperiode des Deutschen Bundestages?',['3 Jahre','4 Jahre','5 Jahre','6 Jahre'],1,'Der Bundestag wird für vier Jahre gewählt (Art. 39 GG).');
  mc('s-p5','pug','Bundesregierung','Wer wählt den Bundeskanzler oder die Bundeskanzlerin?',['Das Volk direkt','Der Bundespräsident','Der Bundestag','Der Bundesrat'],2,'Der Bundestag wählt auf Vorschlag des Bundespräsidenten (Art. 63 GG).');
  mc('s-p6','pug','Wahlen','Ab welchem Alter darf man bei der Bundestagswahl wählen?',['16 Jahre','18 Jahre','21 Jahre','25 Jahre'],1,'Das aktive Wahlrecht beginnt mit 18 Jahren.');
  sh('s-p7','pug','Gewaltenteilung','Nenne die drei Staatsgewalten und je eine zugehörige Institution.','Legislative (Bundestag), Exekutive (Bundesregierung) und Judikative (Gerichte, zum Beispiel das Bundesverfassungsgericht).','Die Gewaltenteilung verhindert Machtmissbrauch durch gegenseitige Kontrolle.');
  sh('s-p8','pug','Sozialversicherung','Welche fünf Zweige hat die gesetzliche Sozialversicherung in Deutschland?','Kranken-, Pflege-, Renten-, Arbeitslosen- und Unfallversicherung.','Die Beiträge zahlen meist Arbeitnehmer und Arbeitgeber gemeinsam; die Unfallversicherung zahlt allein der Arbeitgeber.');
  return out;
}
function fresh(){return {v:1,start:ymd(new Date()),questions:seed(),stats:{},days:{}};}

/* state */
let S=fresh();
let sampleFn=null, imgLim=null;
const store={ref:null,base:null,n:0};
const chunkCache={};
const ui={
  view:'home',ready:false,mode:'local',quiz:null,focus:null,
  add:{subj:'pug',files:[],text:'',n:'auto',busy:false,status:'',error:'',preview:null,ctl:null,imp:''},
  lib:{filter:'all',open:null,confirm:false}
};

/* persistence */
let saveTimer=null,saving=false,again=false;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(flush,500);}
async function flush(){
  if(!ui.ready)return;
  if(saving){again=true;return;}
  saving=true;
  try{
    do{
      again=false;
      const body=JSON.parse(JSON.stringify(S));
      body.updated=Date.now();
      if(store.ref){
        try{
          const qs=body.questions,chunks=[];
          for(let i=0;i<qs.length;i+=CH)chunks.push(qs.slice(i,i+CH));
          for(let i=0;i<chunks.length;i++){
            const str=JSON.stringify(chunks[i]);
            if(chunkCache[i]!==str){await store.base.doc('qs'+i).set({items:chunks[i]});chunkCache[i]=str;}
          }
          for(let i=chunks.length;i<store.n;i++){await store.base.doc('qs'+i).set({items:[]});delete chunkCache[i];}
          store.n=chunks.length;
          await store.ref.set({v:2,start:body.start,stats:body.stats,days:body.days,chunks:chunks.length,goal:body.goal,updated:body.updated});
        }catch(e){}
      }
      try{localStorage.setItem(KEY,JSON.stringify(body));}catch(e){}
    }while(again);
  }finally{saving=false;}
}
async function init(){
  render();
  let data=null;
  try{
    const c=window.claude;
    if(c&&typeof c.use==='function'){
      const got=await Promise.all([c.use('user').catch(()=>null),c.use('db').catch(()=>null),c.use('sample').catch(()=>null)]);
      const user=got[0],db=got[1],smp=got[2];
      if(smp){sampleFn=smp;try{const lim=await smp.limits();imgLim=(lim&&lim.images)||null;}catch(e){}}
      if(user&&db){
        const id=await user.id();
        if(id){
          store.base=db.collection('data/users/'+id);
          store.ref=store.base.doc('state');
          try{
            const snap=await store.ref.get();
            if(snap.exists){
              data=JSON.parse(JSON.stringify(snap.data()));
              if(!Array.isArray(data.questions)){
                const qs=[],n=data.chunks||0;
                for(let i=0;i<n;i++){
                  const cs=await store.base.doc('qs'+i).get();
                  const items=cs.exists?(cs.data().items||[]):[];
                  chunkCache[i]=JSON.stringify(items);
                  qs.push(...items);
                }
                data.questions=qs;store.n=n;
              }
            }
            ui.mode='db';
          }catch(e){store.ref=null;store.base=null;data=null;}
        }
      }
    }
  }catch(e){}
  if(!data){try{const raw=localStorage.getItem(KEY);if(raw)data=JSON.parse(raw);}catch(e){}}
  const isNew=!(data&&Array.isArray(data.questions));
  S=isNew?fresh():data;
  S.stats=S.stats||{};S.days=S.days||{};S.start=S.start||ymd(new Date());
  GOAL=Math.min(Math.max(parseInt(S.goal,10)||10,1),100);
  const nBefore=S.questions.length;
  S.questions=S.questions.filter(q=>SUBJ[q.subj]);
  const keepIds=new Set(S.questions.map(q=>q.id));
  Object.keys(S.stats).forEach(id=>{if(!keepIds.has(id))delete S.stats[id];});
  const cleaned=S.questions.length!==nBefore;
  ui.ready=true;
  render();
  if(isNew||cleaned||ui.mode==='db')save();
}

/* progress helpers */
const mastered=q=>{const s=S.stats[q.id];return !!(s&&s.streak>=2);};
function rec(q,ok){
  const s=S.stats[q.id]||(S.stats[q.id]={r:0,w:0,streak:0,last:0});
  if(ok){s.r++;s.streak++;}else{s.w++;s.streak=0;}
  s.last=Date.now();
  const k=ymd(new Date());S.days[k]=(S.days[k]||0)+1;
  save();
}
function streakDays(){
  const d=new Date();
  if(!S.days[ymd(d)])d.setDate(d.getDate()-1);
  let n=0;
  while(S.days[ymd(d)]>0){n++;d.setDate(d.getDate()-1);}
  return n;
}
function priority(q){
  const s=S.stats[q.id];
  if(!s)return 3+Math.random();
  const t=s.r+s.w,miss=s.w/t,age=(Date.now()-s.last)/864e5;
  let p=1+2*miss+Math.min(age,7)/7;
  if(s.streak>=3)p-=1;
  return p+Math.random()*.5;
}
function topicStats(){
  const m={};
  for(const q of S.questions){
    const s=S.stats[q.id];if(!s)continue;
    const k=q.subj+'|'+q.topic;
    const t=m[k]||(m[k]={subj:q.subj,topic:q.topic,r:0,w:0});
    t.r+=s.r;t.w+=s.w;
  }
  return Object.values(m).filter(t=>t.r+t.w>=2).map(t=>Object.assign({acc:t.r/(t.r+t.w)},t)).filter(t=>t.acc<.8).sort((a,b)=>a.acc-b.acc).slice(0,4);
}
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true;},3200);
}

function homeView(){
  const left=daysBetween(new Date(),EXAM);
  const big=left>=0?String(left):'–';
  const lbl=left>1?'days to the exam':left===1?'day to the exam':left===0?'Exam day':'Exam has passed';
  const dateTxt='Exam · '+EXAM.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'long',year:'numeric'});
  const sp=S.start.split('-').map(Number),start=new Date(sp[0],sp[1]-1,sp[2]);
  const span=Math.max(daysBetween(start,EXAM),1),total=Math.min(span,60);
  const elapsed=Math.min(Math.max(daysBetween(start,new Date())-(span-total),0),total);
  let ticks='';
  for(let i=0;i<=total;i++)ticks+=`<i class="${i<elapsed?'past':i===elapsed?'now':''}"></i>`;
  const un=S.questions.filter(q=>!mastered(q)).length;
  const pace=!S.questions.length?'Add notes to build your question set.'
    :un===0?'Every question is mastered. Daily practice keeps them fresh.'
    :left>0?`${pl(un,'question')} still to master, about ${Math.ceil(un/left)} a day.`
    :`${pl(un,'question')} not mastered yet.`;
  const today=S.days[ymd(new Date())]||0,sd=streakDays();
  const dis=!ui.ready||!S.questions.length;
  const weak=topicStats();
  return `
  <section class="ticket" aria-label="Exam countdown">
    <div class="cd"><span class="n">${big}</span><span class="l">${lbl}</span><span class="d">${esc(dateTxt)}</span></div>
    <div class="tally" aria-hidden="true">${ticks}</div>
    <p class="pace">${esc(pace)}</p>
  </section>
  <button class="daily" data-act="daily" ${dis?'disabled':''}>
    <span><b>${ui.ready?'Daily practice':'Loading your progress…'}</b><small>${today}/${GOAL} today${sd?' · '+sd+'-day streak':''}</small>
    <span class="bar2"><i style="width:${Math.min(100,today/GOAL*100)}%"></i></span></span>
    <span aria-hidden="true">→</span>
  </button>
  <div class="rowc"><label class="t" for="goal"><span>Questions per round</span><small class="note">Used by daily practice and the practice buttons</small></label><input class="field" id="goal" type="number" inputmode="numeric" min="1" max="100" step="1" value="${GOAL}" style="width:84px"></div>
  <h2 class="sh">Subject</h2>
  <div class="grid">${Object.keys(SUBJ).map(subjCard).join('')}</div>
  <h2 class="sh">Weak spots</h2>
  ${weak.length?`<div class="grid">${weak.map(t=>`
    <div class="rowc"><div class="t"><span class="de">${esc(t.topic)}</span><div>${chip(t.subj)}</div></div>
    <span class="acc">${Math.round(t.acc*100)}%</span>
    <button class="btn ghost sm" data-act="drill" data-s="${t.subj}" data-topic="${esc(t.topic)}">Drill</button></div>`).join('')}</div>`
  :`<p class="empty">Answer a few questions and your weakest topics show up here.</p>`}`;
}
function subjCard(k){
  const qs=S.questions.filter(q=>q.subj===k);
  let r=0,w=0;qs.forEach(q=>{const s=S.stats[q.id];if(s){r+=s.r;w+=s.w;}});
  const acc=r+w?Math.round(100*r/(r+w))+'%':'–';
  const m=qs.filter(mastered).length,pct=qs.length?Math.round(100*m/qs.length):0;
  return `<article class="card subj ${SUBJ[k].cls}">
    <h3 lang="de">${esc(SUBJ[k].name)}</h3>
    <dl class="stats"><div><dt>Questions</dt><dd>${qs.length}</dd></div><div><dt>Correct</dt><dd>${acc}</dd></div><div><dt>Mastered</dt><dd>${m}</dd></div></dl>
    <div class="meter" aria-hidden="true"><b style="width:${pct}%"></b></div>
    <div class="actions"><button class="btn" data-act="practice" data-s="${k}" ${!ui.ready||!qs.length?'disabled':''}>Practice ${Math.min(GOAL,qs.length)||''}</button><button class="btn ghost" data-act="addfor" data-s="${k}">Add notes</button></div>
  </article>`;
}

function quizView(){
  const Q=ui.quiz,it=Q.items[Q.i],q=it.q,total=Q.items.length;
  const last=Q.i===total-1;
  let body='';
  if(q.type==='mc'){
    body+=`<div class="opts" role="group" aria-label="Answers">`+it.order.map((real,k)=>{
      let cls='opt';
      if(Q.answered){if(real===q.correct)cls+=' right';else if(k===Q.pick)cls+=' wrong';}
      return `<button class="${cls}" data-act="pick" data-k="${k}" ${Q.answered?'aria-disabled="true"':''}><span class="k">${'ABCD'[k]}</span><span class="de">${esc(q.options[real])}</span></button>`;
    }).join('')+`</div>`;
    if(Q.answered){
      const ok=it.order[Q.pick]===q.correct;
      body+=`<div id="fb" class="fb ${ok?'good':'bad'}" role="status"><strong>${ok?'Correct':'Not quite'}</strong>${q.expl?`<p class="de" lang="de">${esc(q.expl)}</p>`:''}</div>
      <div class="dock"><button id="next" class="btn" data-act="next">${last?'See results':'Next question'}</button></div>`;
    }
  }else if(!Q.revealed){

    <textarea id="typed" rows="4" lang="de" placeholder="Antwort auf Deutsch …">${esc(Q.typed)}</textarea>

  }else{
    body+=(Q.typed.trim()?`<div class="blk"><span class="lbl">Your answer</span><p class="de" lang="de">${esc(Q.typed)}</p></div>`:'')
    +`<div class="blk model" id="fb"><span class="lbl">Model answer</span><p class="de" lang="de">${esc(q.a)}</p></div>`
    +(q.expl?`<div class="blk"><span class="lbl">Explanation</span><p class="de" lang="de">${esc(q.expl)}</p></div>`:'')

  }
  return `<section>
    <div class="qhead"><button class="link" data-act="quit">End</button><div class="bar"><b style="width:${Math.round(100*Q.i/total)}%"></b></div><span class="mono">${Q.i+1}/${total}</span></div>

    <h2 class="q de" lang="de">${esc(q.q)}</h2>
    ${body}
  </section>`;
}

/* quiz flow */
function startQuiz(o){
  let pool=S.questions.filter(q=>(!o.subj||q.subj===o.subj)&&(!o.topic||q.topic===o.topic));
  if(o.ids)pool=S.questions.filter(q=>o.ids.indexOf(q.id)>=0);
  if(!pool.length){toast('No questions to practice yet.');return;}
  pool=pool.map(q=>[priority(q),q]).sort((a,b)=>b[0]-a[0]).slice(0,o.n||GOAL).map(x=>x[1]);
  shuffle(pool);
  ui.quiz={items:pool.map(q=>({q,order:q.type==='mc'?shuffle(q.options.map((_,i)=>i)):[]})),i:0,right:0,answered:false,pick:null,typed:'',revealed:false,missed:[],label:o.label};
  go('quiz');
}
function advance(){

  if(Q.i>=Q.items.length)ui.view='results';

/* generating questions */
let pdfPromise=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s);});}
function loadPdf(){
  if(!pdfPromise){
    const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    pdfPromise=loadScript(base+'pdf.min.js').then(()=>loadScript(base+'pdf.worker.min.js')).then(()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';return window.pdfjsLib;});
    pdfPromise.catch(()=>{pdfPromise=null;});
  }
  return pdfPromise;
}
async function pdfText(file){
  const lib=await loadPdf();
  const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;
  let out='';const max=Math.min(doc.numPages,60);
  for(let p=1;p<=max;p++){const pg=await doc.getPage(p);const tc=await pg.getTextContent();out+=tc.items.map(i=>i.str).join(' ')+'\n\n';}
  return out;
}
function setStatus(m){ui.add.status=m;const el=$('#gen-status');if(el)el.textContent=m;}
function norm(o,subj){
  if(!o||typeof o!=='object')return null;
  const q=String(o.q||o.question||'').trim();if(!q)return null;
  const topic=String(o.topic||'Allgemein').trim().slice(0,40)||'Allgemein';
  const expl=String(o.expl||o.explanation||'').trim().slice(0,400);
  const id='q'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  if(o.type==='mc'||Array.isArray(o.options)){
    const opts=(o.options||[]).map(x=>String(x).trim()).filter(Boolean).slice(0,4);
    const c=Number(o.correct);
    if(opts.length<2||!Number.isInteger(c)||c<0||c>=opts.length)return null;
    return {id,subj,topic,type:'mc',q:q.slice(0,500),options:opts.map(x=>x.slice(0,200)),correct:c,expl};
  }
  const a=String(o.a||o.answer||'').trim();if(!a)return null;
  return {id,subj,topic,type:'short',q:q.slice(0,500),a:a.slice(0,600),expl};
}
function parseLines(text){
  const out=[];
  String(text||'').split('\n').forEach(l=>{
    l=l.trim().replace(/^```(json)?/,'').replace(/,$/,'').trim();
    if(!l||l[0]!=='{')return;
    try{out.push(JSON.parse(l));}catch(e){}
  });
  return out;
}
async function runPart(prompt,opts){
  try{return parseLines((await sampleFn(prompt,opts)).text);}
  catch(e){if(e&&typeof e==='object'&&e.text)e.items=parseLines(e.text);throw e;}
}
function absorb(items,collected,subj){
  const seen=new Set(S.questions.filter(q=>q.subj===subj).concat(collected).map(q=>q.q.trim().toLowerCase()));
  for(const o of items){
    const q=norm(o,subj);if(!q)continue;
    const k=q.q.trim().toLowerCase();if(seen.has(k))continue;
    seen.add(k);collected.push(q);
  }
}
function errCopy(e){
  const c=e&&e.code;
  switch(c){
    case 'cancelled':return '';
    case 'pdf':return `Could not read ${e.name}. Try photographing the pages or paste the text.`;
    case 'scan':return `${e.name} has no readable text, it may be a scan. Photograph the pages instead.`;
    case 'noimg':return 'Photos are not supported in this view. Paste the text instead.';
    case 'not_granted':return 'Claude access was not allowed for this page, so questions cannot be written.';
    case 'sampling_disabled':return 'Claude is not available for this account.';
    case 'rate_limited':return 'Too many requests or your usage limit is reached. Try again later.';
    case 'image_rejected':return 'One of the photos could not be used. Try a different photo.';
    case 'prompt_too_large':return 'The notes are too long. Use fewer files or shorter text.';
    case 'refused':return 'Claude could not write questions from this material.';
    case 'invalid_json':case 'empty_completion':return 'Claude did not return usable questions. Try again, or use fewer notes at once.';
    case 'session_expired':return 'Your session expired. Sign in again and retry.';
    default:return 'Something went wrong while writing the questions. Try again in a moment.';
  }
}
async function generate(){
  const A=ui.add;
  if(A.busy||!sampleFn)return;
  A.error='';A.preview=null;
  const imgs=A.files.filter(f=>/^image\//.test(f.type));
  const others=A.files.filter(f=>!/^image\//.test(f.type));
  if(!imgs.length&&!others.length&&!A.text.trim()){A.error='Add a photo, a PDF, or paste some notes first.';render();return;}
  const ctl=new AbortController();
  A.ctl=ctl;A.busy=true;A.status='Reading your files…';render();
  const collected=[];
  try{
    let notes=A.text.trim();
    for(const f of others){
      if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){
        setStatus('Reading '+f.name+'…');
        let t='';
        try{t=await pdfText(f);}catch(e){throw {code:'pdf',name:f.name};}
        if(t.replace(/\s/g,'').length<40)throw {code:'scan',name:f.name};
        notes+='\n\n'+t;
      }else{notes+='\n\n'+await f.text();}
    }
    if(ctl.signal.aborted)throw {code:'cancelled'};
    notes=notes.trim().slice(0,400000);
    let extra='';
    const imgBatches=[];
    if(imgs.length){
      if(!imgLim)throw {code:'noimg'};
      for(let i=0;i<imgs.length;i+=imgLim.maxCount)imgBatches.push(imgs.slice(i,i+imgLim.maxCount));
    }
    const parts=[];
    let pos=0;
    while(pos<notes.length){
      let end=Math.min(pos+CHUNK,notes.length);
      if(end<notes.length){const br=notes.lastIndexOf('\n',end);if(br>pos+CHUNK/2)end=br;}
      const t=notes.slice(pos,end).trim();
      if(t)parts.push({text:t,imgs:[]});
      pos=end;
    }
    imgBatches.forEach(b=>parts.push({text:'',imgs:b}));
    if(parts.length>40){parts.length=40;extra='Very long upload: the first 40 parts were used.';}
    const sn=SUBJ[A.subj].name;
    const perPart=A.n==='auto'?0:Math.max(1,Math.ceil(A.n/parts.length));
    for(let pi=0;pi<parts.length;pi++){
      if(ctl.signal.aborted)throw {code:'cancelled'};
      const part=parts[pi];
      const label=parts.length>1?`Part ${pi+1} of ${parts.length}`:'Writing questions';
      const known=S.questions.filter(q=>q.subj===A.subj).map(q=>q.q).concat(collected.map(q=>q.q)).slice(-40).map(q=>'- '+q.slice(0,100)).join('\n');
      const amount=perPart?`genau ${perPart}`:'so viele wie nötig, damit alle prüfungsrelevanten Fakten, Begriffe, Zahlen und Zusammenhänge dieser Unterlagen abgedeckt sind (jede wichtige Information mindestens einmal)';
      const prompt=`Du bist Prüfer für das Fach "${sn}" in einer beruflichen Ausbildung. Die Prüfung ist am 11. Dezember. Erstelle aus den Lernunterlagen unten ${amount} Prüfungsfragen auf Deutsch.

Regeln:
- Nutze nur Inhalte aus den Unterlagen (Text und angehängte Fotos). Erfinde keine Fakten.
- Etwa 70 % Multiple-Choice-Fragen (type "mc") mit genau 4 Antwortmöglichkeiten, genau eine ist richtig, die falschen sind plausibel. Die Position der richtigen Antwort ist zufällig (Index 0 bis 3 in "correct").
- Etwa 30 % Fragen mit freier Antwort (type "short") und einer kurzen Musterantwort in "a" (1 bis 2 Sätze).
- "topic" ist ein kurzes Thema (1 bis 3 Wörter, aus den Unterlagen). "expl" ist eine Erklärung in höchstens einem Satz.
- Stelle keine Frage, die inhaltlich einer dieser vorhandenen Fragen entspricht:
${known||'(keine)'}

Antworte nur mit JSON Lines: genau ein JSON-Objekt pro Zeile, kein Array, kein Text davor oder danach, keine Code-Blöcke. Beispiel:
{"topic":"Legionellen","type":"mc","q":"Frage?","options":["A","B","C","D"],"correct":2,"expl":"Kurze Erklärung."}
{"topic":"Gewaltenteilung","type":"short","q":"Frage?","a":"Musterantwort.","expl":"Kurze Erklärung."}

UNTERLAGEN:
${part.text||'Die Unterlagen sind die angehängten Fotos.'}`;
      setStatus(label+'…');
      const opts={signal:ctl.signal,cache:false,onText:u=>{const c=(u.text.match(/"q"\s*:/g)||[]).length;setStatus(`${label} · ${collected.length+c} questions so far`);}};
      if(part.imgs.length)opts.images=part.imgs;
      absorb(await runPart(prompt,opts),collected,A.subj);
      if(A.n!=='auto'&&collected.length>=A.n)break;
    }
    if(A.n!=='auto'&&collected.length>A.n)collected.length=A.n;
    if(!collected.length)throw {code:'empty_completion'};
    A.preview=collected.map(q=>Object.assign({keep:true},q));
    if(extra)toast(extra);
  }catch(e){
    A.error=errCopy(e);
    if(e&&e.code==='cancelled')A.error='';
    if(e&&e.items)absorb(e.items,collected,A.subj);
    if(collected.length){A.preview=collected.map(q=>Object.assign({keep:true},q));A.error=(A.error?A.error+' ':'')+'Showing the questions written so far.';}
  }finally{
    A.busy=false;A.ctl=null;render();
  }
}
function importJson(){
  const A=ui.add,raw=A.imp||'';
  const a=raw.indexOf('['),b=raw.lastIndexOf(']');
  let arr=null;
  try{arr=JSON.parse(a>=0&&b>a?raw.slice(a,b+1):raw);}catch(e){}
  if(!Array.isArray(arr)){toast('That is not valid JSON. Paste the array of questions.');return;}
  const list=arr.map(o=>norm(o,A.subj)).filter(Boolean);
  if(!list.length){toast('No valid questions found in that JSON.');return;}
  S.questions=S.questions.concat(list);A.imp='';save();
  toast(`Added ${pl(list.length,'question')} to ${SUBJ[A.subj].short}.`);
  render();
}

/* actions */
function act(a,d){
  const Q=ui.quiz;
  switch(a){
    case 'tab':go(d.tab);break;
    case 'daily':startQuiz({n:GOAL,label:'Daily practice'});break;
    case 'practice':startQuiz({subj:d.s,n:GOAL,label:SUBJ[d.s].short});break;
    case 'drill':startQuiz({subj:d.s,topic:d.topic,n:GOAL,label:d.topic});break;
    case 'addfor':ui.add.subj=d.s;go('add');break;
    case 'subj':ui.add.subj=d.s;render();break;
    case 'rmfile':ui.add.files.splice(+d.i,1);render();break;
    case 'gen':generate();break;
    case 'stop':if(ui.add.ctl)ui.add.ctl.abort();break;
    case 'addsel':{
      const keep=ui.add.preview.filter(p=>p.keep).map(p=>{const c=Object.assign({},p);delete c.keep;return c;});
      S.questions=S.questions.concat(keep);save();
      ui.add.preview=null;ui.add.files=[];ui.add.text='';
      toast(`Added ${pl(keep.length,'question')} to ${SUBJ[ui.add.subj].short}.`);
      render();break;
    }
    case 'imp':importJson();break;
    case 'pick':{
      if(Q.answered)break;
      const it=Q.items[Q.i],k=+d.k,ok=it.order[k]===it.q.correct;
      rec(it.q,ok);Q.answered=true;Q.pick=k;
      if(ok)Q.right++;else Q.missed.push(it.q);
      ui.focus='next';render();break;
    }
    case 'check':{
      const t=$('#typed');if(t)Q.typed=t.value;
      Q.revealed=true;ui.focus='gotit';render();break;
    }
    case 'rate':{
      const q=Q.items[Q.i].q,ok=d.ok==='1';
      rec(q,ok);if(ok)Q.right++;else Q.missed.push(q);
      advance();break;
    }
    case 'next':advance();break;
    case 'quit':go('home');break;
    case 'retry':startQuiz({ids:Q.missed.map(q=>q.id),n:100,label:'Missed questions'});break;
    case 'lfilter':ui.lib.filter=d.f;render();break;
    case 'lopen':ui.lib.open=ui.lib.open===d.id?null:d.id;render();break;
    case 'ldel':
      S.questions=S.questions.filter(q=>q.id!==d.id);delete S.stats[d.id];ui.lib.open=null;save();render();break;
    case 'rmstarter':{
      const ids=S.questions.filter(q=>q.starter).map(q=>q.id);
      S.questions=S.questions.filter(q=>!q.starter);ids.forEach(i=>{delete S.stats[i];});
      save();toast('Starter questions removed.');render();break;
    }
    case 'reset1':ui.lib.confirm='reset';render();break;
    case 'qs1':ui.lib.confirm='qs';render();break;
    case 'all1':ui.lib.confirm='all';render();break;
    case 'reset0':ui.lib.confirm=false;render();break;
    case 'qs2':S.questions=[];S.stats={};ui.lib.confirm=false;ui.lib.open=null;save();toast('All questions deleted.');render();break;
    case 'all2':
      S.questions=[];S.stats={};S.days={};S.start=ymd(new Date());
      ui.lib.confirm=false;ui.lib.open=null;ui.lib.filter='all';
      ui.add.files=[];ui.add.text='';ui.add.preview=null;ui.add.error='';ui.add.imp='';
      save();toast('The app is clean.');render();break;
    case 'clearadd':ui.add.files=[];ui.add.text='';ui.add.preview=null;ui.add.error='';render();break;
    case 'reset2':S.stats={};S.days={};ui.lib.confirm=false;save();toast('Progress reset.');render();break;
  }
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t||t.disabled)return;
  act(t.dataset.act,t.dataset);
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='notes')ui.add.text=e.target.value;
  else if(id==='imp')ui.add.imp=e.target.value;
  else if(id==='count'){const v=parseInt(e.target.value,10);ui.add.n=v>0?Math.min(v,500):'auto';}
  else if(id==='typed'&&ui.quiz)ui.quiz.typed=e.target.value;
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='goal'){const v=parseInt(t.value,10);if(v>0){GOAL=Math.min(v,100);S.goal=GOAL;save();}render();return;}
  if(t.id==='files'||t.id==='camera'){
    Array.from(t.files).forEach(f=>{
      if(!ui.add.files.some(x=>x.name===f.name&&x.size===f.size&&x.lastModified===f.lastModified))ui.add.files.push(f);
    });
    t.value='';render();
  }
  else if(t.dataset.keep!==undefined&&ui.add.preview){
    ui.add.preview[+t.dataset.keep].keep=t.checked;render();
  }
});
document.addEventListener('keydown',e=>{
  if(ui.view!=='quiz'||e.target.tagName==='TEXTAREA')return;
  const Q=ui.quiz,it=Q.items[Q.i];
  if(!it||it.q.type!=='mc'||Q.answered)return;
  const n=parseInt(e.key,10);
  if(n>=1&&n<=it.order.length)act('pick',{k:String(n-1)});
});

init();
})();
</script>

</body></html>
